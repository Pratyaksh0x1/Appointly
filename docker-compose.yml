version: '3.8'

services:
  appointly-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appointly-api
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - LOG_LEVEL=info
      - USE_IN_MEMORY_DB=${USE_IN_MEMORY_DB:-false}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@localhost:5432/appointly}
      - GNANI_API_KEY=${GNANI_API_KEY:-your_gnani_api_key_here}
      - GNANI_STT_URL=${GNANI_STT_URL:-https://api.vachana.ai/stt/v3}
      - GNANI_TTS_URL=${GNANI_TTS_URL:-https://api.vachana.ai/api/v1/tts/inference}
      - EVON_API_KEY=${EVON_API_KEY:-your_evon_api_key_here}
      - EVON_BASE_URL=${EVON_BASE_URL:-https://api.vachana.ai/v1}
      - EVON_MODEL=${EVON_MODEL:-evon-30b}
      - USE_MOCK_SERVICES=${USE_MOCK_SERVICES:-true}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
